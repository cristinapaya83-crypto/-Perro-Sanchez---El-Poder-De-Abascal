name: Compilar Juego DS

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar NDS
        run: |
          source /etc/profile.d/devkit-env.sh
          make
      - name: Subir archivo NDS
        uses: actions/upload-artifact@v4
        with:
          name: PerroSanchez_DS
          path: PerroSanchez_DS.nds
